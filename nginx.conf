server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls (including SSE streaming) to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE requires buffering disabled and a long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # Pass SSE content-type through without modification
        proxy_set_header Accept-Encoding "";
    }

    # SPA — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — aggressive caching since Vite hashes filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
