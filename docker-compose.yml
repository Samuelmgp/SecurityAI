services:

  # ── Ollama inference server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4.0'      # inference gets the lion's share
          memory: 6G
      # ── NVIDIA GPU support (uncomment if available) ─────────────────────
      # reservations:
      #   devices:
      #     - driver: nvidia
      #       count: all
      #       capabilities: [gpu]

  # ── One-shot: pull the model on first run (skipped on subsequent starts) ─
  ollama-init:
    image: ollama/ollama:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        MODEL=$${OLLAMA_MODEL:-phi3:mini}
        echo "Pulling model: $$MODEL"
        n=0
        until ollama pull "$$MODEL"; do
          n=$$((n+1))
          if [ $$n -ge 5 ]; then
            echo "ERROR: failed to pull $$MODEL after 5 attempts"
            exit 1
          fi
          echo "Attempt $$n failed — retrying in 5s..."
          sleep 5
        done
        echo "Model $$MODEL ready."
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./book_data:/app/book_data:ro   # textbook PDFs (read-only)
      - chroma_data:/app/data/chroma    # persistent vector DB
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      BOOKS_DIR: /app/book_data
      CHROMA_DIR: /app/data/chroma
      FRONTEND_ORIGIN: http://localhost
      # Cap ONNX Runtime / OpenMP thread pool so ingestion doesn't
      # saturate all CPUs — embedding is memory-bandwidth bound anyway.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

  # ── React frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ""   # empty → relative URLs → nginx proxies /api/* to backend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:   # LLM weights — persisted across restarts
  chroma_data:     # ChromaDB vector store — persisted across restarts
